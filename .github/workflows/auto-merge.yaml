name: Auto-merge

# The `/next-issue` loop runs unattended, so the merge that ends a cycle has to
# happen without a human at the keyboard. Rather than let the agent driving the
# loop run `gh pr merge` itself, the loop labels the pull request and this
# workflow hands it to GitHub's native auto-merge.
#
# The point is where the policy lives. A merge the agent performs is a judgement
# made mid-cycle and visible only in a transcript; a merge this workflow performs
# is governed by two things you can read and change: the label gate below, and
# the branch protection rule on `main` that requires `build`.
#
# Neither path around that rule exists. If checks are still running, auto-merge
# is armed and GitHub holds the pull request until `build` passes, never merging
# it if it does not — a failing check leaves the pull request open with
# auto-merge still armed, so pushing a fix is enough to let it through, and
# nothing is closed on your behalf. If checks have already passed, the merge
# happens immediately, and branch protection still refuses any merge that would
# violate it. The label decides *when* the merge is attempted, not *whether* the
# rule applies.
#
# Adding the label is itself a permission boundary: it takes write access to the
# repository, so a pull request from a fork cannot trigger this by labelling
# itself.

on:
  pull_request:
    types:
      - labeled

# `contents: write` is not optional here, despite this job checking out nothing.
# `gh pr merge --auto` only *arms* auto-merge while something still blocks the
# pull request; once the required checks are already green it merges immediately
# instead, and that path writes to repository contents. Because the loop labels
# only after checks pass, the immediate path is the common one — `contents: read`
# fails it with `Resource not accessible by integration (mergePullRequest)`.
permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable auto-merge
    # Every other label on a pull request — `story`, `blocked`, whatever arrives
    # later — leaves this workflow inert.
    if: github.event.label.name == 'auto-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # `--auto` queues the merge instead of performing it: GitHub squashes the
        # pull request when the required checks pass, and does nothing if they
        # never do. The repository allows squash merges only and has
        # `deleteBranchOnMerge` set, so the branch is removed on the way out.
        run: gh pr merge "$PR" --repo "$REPO" --squash --auto
