name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A pull request only needs an answer about its newest commit. Superseded runs
# are cancelled so the queue reflects what is actually up for review. Pushes to
# main keep their runs — main's history is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The toolchain version lives in go.mod and nowhere else, so bumping
          # the module bumps CI with it.
          go-version-file: go.mod
          # Caches both the module download cache and the build cache, keyed by
          # go.sum, so a warm run does not recompile the dependency tree.
          cache: true
          cache-dependency-path: go.sum

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
