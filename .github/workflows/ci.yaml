name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A pull request only needs an answer about its newest commit. Superseded runs
# are cancelled so the queue reflects what is actually up for review. Pushes to
# main keep their runs — main's history is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The toolchain version lives in go.mod and nowhere else, so bumping
          # the module bumps CI with it.
          go-version-file: go.mod
          # Caches both the module download cache and the build cache, keyed by
          # go.sum, so a warm run does not recompile the dependency tree.
          cache: true
          cache-dependency-path: go.sum

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The goldens under testdata are how a change to the printer or to the
      # diagnostic renderer is reviewed: the diff is what says what the change
      # did. That only holds while every one of them is what this package
      # actually produces, so they are regenerated here and the tree is required
      # to come back unchanged. A golden edited by hand, or left stale by a
      # change nobody regenerated, fails here rather than quietly becoming the
      # recorded behaviour.
      #
      # Only the root package is run, because -update is its flag: passing it to
      # a test binary which does not define one is an error rather than a no-op.
      - name: Check the golden files are what the code produces
        run: |
          go test . -update
          if ! git diff --quiet -- testdata; then
            echo "::error::these golden files are stale; regenerate them with: go test . -update"
            git diff --stat -- testdata
            git diff -- testdata
            exit 1
          fi
