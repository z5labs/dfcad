name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # A release is a tag push and nothing else. The tag is here so the
    # pipeline runs on one at all; whether that run publishes is decided by
    # the publishOn regex against the refs at HEAD, not by this list and not
    # by an `if:` on a job. See docs/publishing.md.
    tags:
      - "v*"

# A pull request only needs an answer about its newest commit. Superseded runs
# are cancelled so the queue reflects what is actually up for review. Pushes to
# main keep their runs — main's history is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The Z5Labs standard pipeline: fmt, vet, golangci-lint and `go test -race`,
  # then an image per platform, published when a ref at HEAD matches publishOn.
  # Every stage is the z5labs module's, reached through this repository's root
  # Dagger module (dagger.json, .dagger/), which pins it by commit and adds only
  # the version and the publish decision the module leaves to its caller. A step
  # here which reran any of those stages would be a second definition of the
  # standard, and the two would drift. See the continuous integration section of
  # CLAUDE.md.
  #
  # The job keeps the name `build`, which is what branch protection on main
  # already requires. What it runs has changed; what it asserts has not.
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing the image to GHCR. Read-only on a pull request from a fork,
      # which is one of the two reasons such a run cannot publish; the other
      # is that its ref does not match publishOn.
      packages: write
      # The workload identity token the module exchanges to sign the image and
      # its SLSA provenance. Without it the module refuses to publish rather
      # than publishing unsigned, so this is not an optional grant on a job
      # that pushes anything.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The version and the publish decision are read out of the refs at
          # HEAD, and the module stamps and annotates every image from the
          # commit, so this needs real git metadata rather than a snapshot of
          # the tree.
          fetch-depth: 0

      # Pinned to the engineVersion the root module declares, read out of
      # dagger.json rather than repeated here. The CLI provisions an engine of
      # its own version, so a number typed into this file could drift from the
      # module's and leave CI running the pipeline on an engine it has never
      # been run against — which is how every pull request here came to fail
      # once already.
      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$(jq -r .engineVersion dagger.json | tr -d v)" \
              BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the standard checks
        run: dagger call ci

      # The version a build is stamped with and whether it publishes, checked
      # against a table of literal cases. A release is the one run where
      # finding out is too late, so the rules are exercised on every pull
      # request rather than first on the tag.
      - name: Check the version scheme
        run: dagger call version-scheme

      # The registry, the credentials and the publishOn regex are inputs to
      # the one call, so this step covers the pull request that must not
      # publish and the tag push that must. Nothing here decides which:
      # publishOn is matched against the refs pointing at HEAD, a pull
      # request's merge commit carries none of them, and the same command
      # therefore builds on a pull request and publishes on a tag.
      #
      # --repository carries the owner because it is the repository path
      # within the registry, and GHCR has no single-segment repositories.
      # Lower-cased because a docker repository path may not carry capitals
      # and a fork's owner may.
      - name: Build the image, and publish it where the ref says to
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            publish
            --publish-on='^refs/(heads/main|tags/v.+)$'
            --registry=ghcr.io
            --repository="${GITHUB_REPOSITORY,,}"
            --username="$GITHUB_ACTOR"
            --password=env:GITHUB_TOKEN
          )
          # The OIDC endpoint is present only where `id-token: write` was
          # actually granted, which a fork's pull request does not get. The
          # inputs are passed when they exist rather than passed empty; a run
          # that is missing them and does try to publish is refused by the
          # module, naming both of them.
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            args+=(
              --id-token-request-url="$ACTIONS_ID_TOKEN_REQUEST_URL"
              --id-token-request-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
            )
          fi
          dagger call "${args[@]}"

  # Repo-specific verification, which the module has no hook for and which
  # therefore lives here as its own job rather than as a step beside a module
  # stage.
  #
  # The goldens under testdata are how a change to the printer or to the
  # diagnostic renderer is reviewed: the diff is what says what the change did.
  # That only holds while every one of them is what this package actually
  # produces, so they are regenerated here and the tree is required to come back
  # unchanged. A golden edited by hand, or left stale by a change nobody
  # regenerated, fails here rather than quietly becoming the recorded behaviour.
  goldens:
    name: goldens
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The toolchain version lives in go.mod and nowhere else, so bumping
          # the module bumps CI with it.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Every package which holds a recorded copy of something it produces
      # defines -update, spelled the same way, so the whole module is
      # regenerated in one command. A package which did not define the flag
      # would fail here rather than ignore it, which is the reason it is one
      # flag rather than a list of packages somebody has to remember to extend.
      - name: Check the golden files are what the code produces
        run: |
          go test ./... -update
          if ! git diff --quiet -- testdata cmd/dfcad/testdata ifc/testdata gml/testdata docs/token-budget.md; then
            echo "::error::these golden files are stale; regenerate them with: go test ./... -update"
            git diff --stat -- testdata cmd/dfcad/testdata ifc/testdata gml/testdata docs/token-budget.md
            git diff -- testdata cmd/dfcad/testdata ifc/testdata gml/testdata docs/token-budget.md
            exit 1
          fi

  # The model gate: `dfcad fmt --check`, `dfcad check` and `dfcad review` over
  # the fixture model, so that a branch whose model is broken — or whose change
  # to the model needs an explanation — is visibly failing rather than merely
  # unreviewed. This is the half a consuming data repository adopts; see
  # .github/gate/README.md.
  model:
    name: model
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Same requirement as the build job: the binary this gate runs is
          # built by the module, which stamps it from the refs at HEAD. The
          # review stage needs it for a second reason of its own — it compares
          # this revision against its merge base with the default branch, and a
          # shallow checkout does not reach one.
          fetch-depth: 0

      # At the engineVersion dagger.json declares, as in the build job.
      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="$(jq -r .engineVersion dagger.json | tr -d v)" \
              BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Taken out of the image the module builds, so the binary the gate runs
      # is the one the pipeline ships. `go run ./cmd/dfcad` would be a second
      # way of producing it, and the gate and the artifact could then disagree
      # about what the tool does.
      - name: Build the dfcad binary with the standard pipeline
        run: |
          dagger call binary export --path=./dfcad
          chmod +x ./dfcad
          ./dfcad --help >/dev/null

      # The stamp is applied by the module's link line and by nothing in this
      # repository, which means nothing here would notice it stopping. A binary
      # that reports itself unstamped is one no bug report can identify, and it
      # would look exactly like a working build everywhere else in this job — so
      # the built binary is asked, every run, and the answer is required to be
      # yes.
      #
      # The symbol names are the module's (main.version, main.commit) and -X
      # against a name that is not there is a silent no-op, so this is also what
      # catches a rename or a move of either variable out of package main. See
      # docs/versioning.md.
      - name: Confirm the pipeline stamped the binary
        run: |
          ./dfcad version | tee /dev/stderr | jq -e '
            .build.stamped == true
            and (.build.version | length > 0)
            and (.build.commit | test("^[0-9a-f]{7,40}$"))
          ' > /dev/null

      # Exercising the gate against two deliberately broken models, every run,
      # and before the gate is believed about anything else. A gate nobody has
      # seen fail is not known to be a gate: a swallowed exit code or a filter
      # which stopped matching would leave every later step passing, and a
      # branch which broke the model would then merge looking exactly like one
      # which did not.
      #
      # It is the binary built above that is asked, so this is also where a bump
      # to the machine output contract surfaces: the self-test requires the
      # build's `.contracts.output` to be the version gate.sh's filters read, and
      # requires each of the three stages to have annotated something. A gate
      # which still blocks while saying nothing on the line — which is what a
      # contract bump left behind last time — fails here.
      - name: Confirm the gate blocks a broken model, and says where
        run: .github/gate/selftest.sh --binary ./dfcad

      - name: Open the runtime table
        run: |
          mkdir -p gate-results
          {
            echo "### dfcad model gate"
            echo
            echo "| model root | fmt ms | fmt exit | check ms | check exit | review ms | review exit |"
            echo "|---|---:|---:|---:|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

      # The fixture model, gated by the binary above. The step summary row each
      # gate writes is where runtime growth becomes visible without downloading
      # anything; the JSON beside it carries the same numbers for a run somebody
      # wants to compare against another.
      - name: Gate the fixture model
        run: |
          .github/gate/gate.sh \
            --binary ./dfcad \
            --root cmd/dfcad/testdata/budget \
            --results gate-results \
            --against "origin/${{ github.event.repository.default_branch }}"

      # Uploaded whatever the gate decided: the run somebody wants the results
      # of is usually the one that failed.
      #
      # A missing result warns rather than fails, so that an upload cannot turn
      # an earlier, clear failure into a second and more confusing one. That the
      # gate does write all three files is asserted by the self-test above,
      # which is the right place for it: there it is a statement about the gate
      # rather than about whether this job got far enough to run it.
      #
      # v5 still warns that it targets Node.js 20. v4 did too, and bumping did
      # not remove it — measured on runs 30981600042 and 30981847887. The
      # deprecation is upstream's to fix; there is no version of this action
      # here which is quiet, so a later bump should not be made expecting one.
      - name: Upload the structured results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: dfcad-gate-results
          path: gate-results/
          if-no-files-found: warn
